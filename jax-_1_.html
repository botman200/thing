<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>P2P Private Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #ffffff; display: flex; height: 100vh; }
        #setup-sidebar { width: 300px; background: #1e1e1e; padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
        #chat-window { flex: 1; display: flex; flex-direction: column; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 70%; background: #2c2c2c; }
        .outgoing { align-self: flex-end; background: #007bff; }
        #input-area { padding: 20px; background: #1e1e1e; display: flex; gap: 10px; }
        input, textarea { width: 100%; padding: 10px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; }
        button { padding: 10px; background: #007bff; border: none; color: white; cursor: pointer; border-radius: 4px; margin-top: 5px; }
        h3 { font-size: 14px; margin-bottom: 5px; color: #aaa; }
    </style>
</head>
<body>
    <div id="setup-sidebar">
        <div style="margin-bottom: 20px;">
            <h3>1. Create Room</h3>
            <button onclick="startHost()">Generate Offer</button>
            <textarea id="offer-out" readonly placeholder="Send this to your peer"></textarea>
        </div>
        <div style="margin-bottom: 20px;">
            <h3>2. Join Room</h3>
            <textarea id="offer-in" placeholder="Paste peer's offer here"></textarea>
            <button onclick="startJoiner()">Accept Offer</button>
        </div>
        <div id="host-confirm" style="display:none;">
            <h3>3. Complete Link</h3>
            <textarea id="answer-in" placeholder="Paste peer's answer here"></textarea>
            <button onclick="completeLink()">Connect</button>
        </div>
    </div>
    <div id="chat-window">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Wait for connection..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let pc;
        let dc;
        const config = { iceServers: [{ urls: 'stun:://google.com' }] };

        function setupDC() {
            dc.onopen = () => {
                document.getElementById('msg-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('msg-input').placeholder = "Connected! Type here...";
            };
            dc.onmessage = e => renderMsg(e.data, 'incoming');
        }

        async function startHost() {
            pc = new RTCPeerConnection(config);
            dc = pc.createDataChannel("chat");
            setupDC();
            pc.onicecandidate = e => {
                if (!e.candidate) {
                    document.getElementById('offer-out').value = btoa(JSON.stringify(pc.localDescription));
                    document.getElementById('host-confirm').style.display = 'block';
                }
            };
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        }

        async function startJoiner() {
            const offer = JSON.parse(atob(document.getElementById('offer-in').value));
            pc = new RTCPeerConnection(config);
            pc.ondatachannel = e => { dc = e.channel; setupDC(); };
            pc.onicecandidate = e => {
                if (!e.candidate) document.getElementById('offer-out').value = btoa(JSON.stringify(pc.localDescription));
            };
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            alert("Answer generated! Copy the output box and send it back to the host.");
        }

        async function completeLink() {
            const answer = JSON.parse(atob(document.getElementById('answer-in').value));
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            if (!input.value) return;
            dc.send(input.value);
            renderMsg(input.value, 'outgoing');
            input.value = '';
        }

        function renderMsg(msg, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = msg;
            document.getElementById('messages').appendChild(div);
        }
    </script>
</body>
</html>
